name: Deploy to GitHub Pages

# Cost note: one ubuntu-latest (1x) job, ~1-2 min per push (npm ci + vite build).
# Docs-only pushes are skipped via paths-ignore. No e2e/browser jobs.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
